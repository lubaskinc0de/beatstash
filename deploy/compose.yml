name: beatstash

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: beatstash
      POSTGRES_DB: beatstash
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: [CMD-SHELL, pg_isready -U beatstash -d beatstash]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql

  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?Set TELEGRAM_API_ID in .env}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?Set TELEGRAM_API_HASH in .env}
      TELEGRAM_LOCAL: '1'
    volumes:
      - telegram_bot_api_data:/var/lib/telegram-bot-api

  bot:
    image: ghcr.io/lubaskinc0de/beatstash:${BEATSTASH_VERSION:?Set BEATSTASH_VERSION in .env}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      telegram-bot-api:
        condition: service_started
    env_file: .env
    environment:
      DB_DSN: host=postgres user=beatstash password=${POSTGRES_PASSWORD} dbname=beatstash port=5432 sslmode=disable
      CONFIG_FILE: /app/config.toml
    volumes:
      - ./config.toml:/app/config.toml:ro
      - ./music:/music
      - telegram_bot_api_data:/var/lib/telegram-bot-api

  navidrome:
    image: deluan/navidrome:0.64.2
    restart: unless-stopped
    ports:
      - '127.0.0.1:4533:4533'
    environment:
      ND_MUSICFOLDER: /music/shared
      ND_DATAFOLDER: /data
      ND_ENABLESHARING: 'true'
    volumes:
      - ./music:/music:ro
      - ./data/navidrome:/data

volumes:
  postgres_data:
  telegram_bot_api_data:
