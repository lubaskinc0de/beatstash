name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish or retry
        required: true
        type: string

permissions:
  contents: read

# Serialize publishing so an older release cannot overwrite latest concurrently.
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.policy.outputs.version }}
      prerelease: ${{ steps.policy.outputs.prerelease }}
      commit: ${{ steps.policy.outputs.commit }}
      image: ${{ steps.policy.outputs.image }}
    steps:
      - name: Select tag
        id: tag
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 -c 'import os,re; assert re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?", os.environ["REQUESTED_TAG"]), "Invalid release tag"'
          echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0
      - name: Check tag and master ancestry
        id: policy
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git fetch origin master:refs/remotes/origin/master
          python3 .github/scripts/release.py validate "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY" >> "$GITHUB_OUTPUT"

  checks:
    needs: validate
    uses: $/.github/workflows/checks.yml
    permissions:
      contents: read
    with:
      ref: ${{ needs.validate.outputs.commit }}

  publish:
    name: Publish image and release
    needs: [validate, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # Create GitHub Releases and upload installation assets.
      packages: write # Push the versioned image and latest alias to GHCR.
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      VERSION: ${{ needs.validate.outputs.version }}
      COMMIT: ${{ needs.validate.outputs.commit }}
      IMAGE: ${{ needs.validate.outputs.image }}
      PRERELEASE: ${{ needs.validate.outputs.prerelease }}
    outputs:
      latest: ${{ steps.latest.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
      - name: Confirm the tag still points to the checked commit
        run: |
          git fetch origin master:refs/remotes/origin/master
          python3 .github/scripts/release.py validate "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$COMMIT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push versioned image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.validate.outputs.image }}:${{ needs.validate.outputs.version }}
          labels: |
            org.opencontainers.image.title=beatstash
            org.opencontainers.image.description=Manage and share your Navidrome music through Telegram
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.documentation=https://${{ github.repository_owner }}.github.io/beatstash/
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}
            org.opencontainers.image.revision=${{ needs.validate.outputs.commit }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          # A published binary must not come from a cache other runs wrote.
          cache: false
      - name: Build the setup tool
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=$VERSION -X main.repository=$GITHUB_REPOSITORY" \
              -o "release-assets/beatstash-setup-linux-$arch" ./cmd/beatstash-setup
          done
      - name: Package installation files
        run: python3 .github/scripts/release.py package "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY"
      - name: Decide whether this is the newest stable release
        id: latest
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases-pages.json"
          python3 -c 'import json,sys; json.dump([r for page in json.load(open(sys.argv[1])) for r in page], sys.stdout)' "$RUNNER_TEMP/releases-pages.json" > "$RUNNER_TEMP/releases.json"
          latest=$(python3 .github/scripts/release.py latest "$RELEASE_TAG" < "$RUNNER_TEMP/releases.json")
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
      - name: Create release and attach templates
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IS_LATEST: ${{ steps.latest.outputs.latest }}
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Docker image: \`$IMAGE:$VERSION\` (Linux AMD64 and ARM64).
          Digest: \`$IMAGE@$DIGEST\`.

          Run \`bash install.sh\` from this release to install, \`bash install.sh upgrade\` to update an installation to this version, or \`bash install.sh uninstall\` to remove one.
          Follow the [installation guide](https://lubaskinc0de.github.io/beatstash/installation/new-server/) or [connect existing Navidrome](https://lubaskinc0de.github.io/beatstash/installation/existing-navidrome/); see the [update steps](https://lubaskinc0de.github.io/beatstash/administration/updates/) before updating.

          For a manual setup, download \`beatstash-$RELEASE_TAG-deploy.tar.gz\` and its checksum below.
          EOF
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$RELEASE_TAG" -f target_commitish="$COMMIT" --jq .body >> "$RUNNER_TEMP/release-notes.md"
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --latest="$IS_LATEST"
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            args=(--verify-tag --target "$COMMIT" --title "beatstash $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --latest="$IS_LATEST")
            if [[ "$PRERELEASE" == true ]]; then args+=(--prerelease); fi
            gh release create "$RELEASE_TAG" release-assets/* "${args[@]}"
          fi
      - name: Update latest stable image
        if: steps.latest.outputs.latest == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$DIGEST"
      - name: Summarize published artifacts
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "Image: \`$IMAGE:$VERSION\`"
            echo "Digest: \`$DIGEST\`"
            echo "Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG"
          } >> "$GITHUB_STEP_SUMMARY"

  refresh-docs:
    name: Refresh documentation release version
    needs: publish
    if: needs.publish.outputs.latest == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write # Dispatch the Pages workflow after publishing a new stable release.
    steps:
      - name: Rebuild documentation on master
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run docs.yml --ref master
