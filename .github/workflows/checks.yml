name: Checks

on:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to check; defaults to the triggering ref
        required: false
        type: string
        default: ''
    outputs:
      coverage:
        description: Statements the end-to-end tests cover, as a percentage
        value: ${{ jobs.e2e.outputs.coverage }}

permissions:
  contents: read

jobs:
  static:
    name: Go static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install Gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan history and current files for secrets
        run: bash .github/scripts/check-secrets.sh
      - name: Verify modules and module files
        run: |
          go mod verify
          go mod tidy -diff
      - name: Vet and compile
        run: |
          go vet ./...
          go build ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.13.2
          args: --timeout=5m
      - name: Check formatting without changing files
        run: |
          golangci-lint fmt --diff ./... > "$RUNNER_TEMP/format.diff"
          if [[ -s "$RUNNER_TEMP/format.diff" ]]; then
            cat "$RUNNER_TEMP/format.diff"
            exit 1
          fi
      - name: Check installer shell scripts
        run: |
          bash -n deploy/install.sh
          bash -n .github/scripts/check-secrets.sh
          shellcheck deploy/install.sh .github/scripts/check-secrets.sh
      - name: Check release policy
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Run unit tests
        run: go test -count=1 ./internal/...
      - name: Check spelling in code and documentation
        uses: crate-ci/typos@00f422f3b19c57bc6338715ebfe3316d38768461 # v1.50.3
        with:
          files: .
          config: _typos.toml
      - name: Check workflow syntax
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          actionlint
      - name: Audit workflow security with zizmor
        run: |
          python3 -m venv "$RUNNER_TEMP/zizmor"
          "$RUNNER_TEMP/zizmor/bin/pip" install zizmor==1.30.1
          "$RUNNER_TEMP/zizmor/bin/zizmor" --offline --persona=auditor --format=github .github

  e2e-shard:
    name: End-to-end tests ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The scenarios saturate the runner's CPU, so only more runners make
        # them faster.
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install audio tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Run this shard's scenarios with application coverage
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: 3
        run: |
          tests=$(grep -ho '^func Test[A-Za-z0-9_]*' e2e/*_test.go | cut -d' ' -f2 | grep -vx TestMain | LC_ALL=C sort \
            | awk -v n="$SHARDS" -v i="$SHARD" '(NR - 1) % n == i - 1' | paste -sd'|')
          go test -count=1 -timeout=25m -parallel=4 -covermode=atomic -coverpkg=./internal/... \
            -coverprofile="coverage-$SHARD.out" -run "^($tests)$" ./e2e/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: coverage-${{ matrix.shard }}.out
          retention-days: 1
          # Re-running a failed shard replaces its own report.
          overwrite: true

  e2e-installer:
    name: Setup tool scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # Each scenario owns its Compose project, Caddy and host ports.
      # Limit concurrency so the runner can handle the Docker stacks.
      - name: Run the setup scenarios with coverage
        run: |
          go test -count=1 -parallel=4 -timeout=25m -covermode=atomic -coverpkg=./internal/installer/... \
            -coverprofile=coverage-installer.out ./e2e/installer/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-shard-installer
          path: coverage-installer.out
          retention-days: 1
          overwrite: true

  e2e:
    name: End-to-end tests
    needs: [e2e-shard, e2e-installer]
    # A skipped required check counts as passed, so this job always runs and
    # fails on its own when a shard did.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      coverage: ${{ steps.summary.outputs.coverage }}
    steps:
      - name: Require every shard to pass
        if: needs.e2e-shard.result != 'success' || needs.e2e-installer.result != 'success'
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-shard-*
          merge-multiple: true
      - name: Merge shard coverage
        run: |
          {
            echo 'mode: atomic'
            tail -qn +2 coverage-*.out
          } > coverage.out
      - name: Summarize coverage
        id: summary
        run: |
          total=$(go tool cover -func=coverage.out | awk 'END { print $NF }')
          echo "Coverage: $total" >> "$GITHUB_STEP_SUMMARY"
          echo "coverage=$total" >> "$GITHUB_OUTPUT"
      - name: Save coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage.out
          retention-days: 14

  docs:
    name: Documentation checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
        working-directory: docs
      - run: npm run check
        working-directory: docs
