# navidrome-tg settings. Passwords and tokens do not go here: they are
# environment variables, see .env.example.
#
# Where the bot looks for this file:
#   - run locally: config.toml in the working directory, or the path in
#     the CONFIG_FILE environment variable;
#   - run with docker compose: copy this file to config.docker.toml and
#     write paths and addresses as the bot's container sees them
#     (the "In compose" notes below).

# Admins by Identity, "channel:id": they can /invite people. For Telegram
# the id is the numeric user id.
admins = ["telegram:869885299"]
# Shown to strangers who write /start, e.g. "@my_contact"; empty hides it.
admin_contact = ""
# What the bot calls the service in its texts.
service_name = "navidrome-tg"

[i18n]
# Folder with extra language files: <language>.yaml, e.g. de.yaml or
# pt-BR.yaml. Take internal/infra/telegram/i18n/locales/en.yaml as the
# template and translate the texts; a file named like a built-in language
# (en.yaml, ru.yaml) overrides the texts it has. Texts a language lacks
# are shown in English. Empty uses the built-in English and Russian only.
dir = ""
# Language of users whose Telegram language has no file.
default_language = "en"

[telegram]
# Local Telegram Bot API server (lifts the 20 MB download limit);
# empty means https://api.telegram.org. In compose: "http://telegram-bot-api:8081".
bot_api_url = ""
# Chat where the bot uploads tracks that came without a Telegram file (e.g.
# from Zvuk), so inline mode can send them as audio right away; the bot must
# be able to post there. 0 uploads a track only when somebody asks for its file.
# np and recent upload a track that has no file yet once the user picks it:
# turn on inline feedback in BotFather (/setinlinefeedback) for that.
storage_chat_id = 0
# Upload every such track to the storage chat in the background. false
# uploads a track there only once somebody picks it in np or recent.
fill_storage_chat = true
# How often the bot checks what became of the tracks and Imports it was
# sent, to react and update progress.
poll_interval = "2s"
# How long a chat waits for an instance that died amid redrawing its window,
# answering a track or uploading a file. It must outlast any Bot API call.
lease_ttl = "1m"

[library]
# In compose: "/music".
music_dir = "~/navidrome-tg/test_data"
# music_dir as the Navidrome container sees it, if the path differs; empty
# means the same. The bot writes only to music_dir/shared, music_dir/users
# and music_dir/.navidrome-tg. A new install: point ND_MUSICFOLDER at
# music_dir/shared once it exists, or Navidrome's own library shows admins
# every track twice. Music you had before: keep it in a folder of its own,
# beside music_dir or in it next to the bot's folders, as a Navidrome
# library; a library that holds the bot's folders is ignored.
navidrome_music_dir = "/music"
# How often the bot looks at the files of music_dir/shared and music_dir/users
# and follows the ones changed by hand: a removed file takes its Track away,
# a retagged or replaced one updates it. It also does so at start.
reconcile_interval = "1h"

[navidrome]
url = "http://localhost:4533"
# Address users open Navidrome at, in a browser or a player app; the bot
# shows it in its instructions. Empty leaves it out.
public_url = ""
# Navidrome admin: the bot creates accounts for invited users with it.
user = "admin"
# Navidrome libraries outside navidrome_music_dir are Attached Libraries:
# the bot tracks their songs but never touches their files. How often it
# rescans them (also at start); "0" turns them off, e.g. when several bots
# share one Navidrome.
attach_interval = "1h"

[invites]
ttl = "168h"

[quota]
# Default Quota of Personal Libraries: how much all tracks of a user may
# weigh together, e.g. "10GB" or "500MB"; empty is unlimited. Takes count
# in full, even though they share the file on disk. The Admin can change it
# in the bot; that value then wins over this one.
default = ""
# Quota of the Shared Library, likewise; empty is unlimited.
shared = ""

[ingest]
workers = 2
# Waits before each retry of a failed Ingest Job.
retry_delays = ["10s", "1m", "5m"]
poll_interval = "1s"
# Files in music_dir/.navidrome-tg older than this were left by a crashed
# Ingest and get removed, at start and this often. A download in progress
# writes to its file all the time, so it never gets this old.
scratch_ttl = "1h"
# A download that sends nothing for this long is cut off and tried again.
stall_timeout = "60s"

[zvuk]
url = "https://zvuk.com"
# How many tracks download at once, for all users together.
workers = 4
# How many of them may belong to one user. More is faster, but the account
# looks less like a person and risks a block.
per_user = 1
# Random pause after each download of an account, so it is not blocked.
pause = ["5s", "10s"]
# How often new likes and playlist tracks are fetched after an Import.
sync_interval = "6h"
# Stars and playlists can be set only on songs Navidrome has already found
# in the library. Until it scans the new files, the bot tries again this often.
mirror_retry_interval = "1m"
