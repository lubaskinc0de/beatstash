# beatstash settings: https://lubaskinc0de.github.io/beatstash/administration/configuration/
# Secrets go to environment variables (.env.example). With docker compose,
# copy this file to config.docker.toml and write paths and addresses as the
# bot's container sees them ("In compose" below).

# Admins as "telegram:<numeric user id>".
admins = ["telegram:869885299"]
# Shown to strangers on /start, e.g. "@my_contact"; empty hides it.
admin_contact = ""
service_name = "beatstash"

[i18n]
# Extra <language>.yaml files, made from
# internal/infra/telegram/i18n/locales/en.yaml; a built-in name overrides its
# texts, missing texts fall back to English. Empty: English and Russian only.
dir = ""
# For users whose Telegram language has no file.
default_language = "en"

[telegram]
# Local Bot API server; empty means api.telegram.org.
# In compose: "http://telegram-bot-api:8081".
bot_api_url = ""
# Chat the bot uploads tracks without a Telegram file to, so inline mode sends
# them as audio; 0 uploads only when a user asks for the file.
# Inline results picked by users need /setinlinefeedback Enabled in BotFather.
storage_chat_id = 0
# Upload all such tracks there in the background; false only the picked ones.
fill_storage_chat = true
poll_interval = "2s"
# How long a crashed instance keeps a chat's window, answer or upload; must
# outlast any Bot API call.
lease_ttl = "1m"

[library]
# In compose: "/music".
music_dir = "~/beatstash/test_data"
# music_dir as Navidrome sees it; empty means the same. Point ND_MUSICFOLDER
# at music_dir/shared, and keep music you had before in a library of its own.
navidrome_music_dir = "/music"
# How often files changed by hand in music_dir/shared and music_dir/users
# are picked up.
reconcile_interval = "1h"
# How often tracks look up again what they lack, such as genres and labels,
# when a music service did not answer before.
enrich_interval = "1h"

[navidrome]
url = "http://localhost:4533"
# Address users open Navidrome at. Listen Links need it reachable from the
# internet and ND_ENABLESHARING=true; empty turns them off.
public_url = ""
listen_link_ttl = "720h"
listen_link_downloadable = true
# How often new tracks are matched to Navidrome songs; "0" turns it off.
song_interval = "1m"
# Navidrome admin that creates accounts for invited users.
user = "admin"
# How often libraries outside navidrome_music_dir are rescanned; "0" turns
# them off.
attach_interval = "1h"
# How long what Navidrome said an account sees is trusted; "0" asks every time.
access_ttl = "30s"

[invites]
ttl = "168h"

[quota]
# Size limits, e.g. "10GB"; empty is unlimited. default is each user's
# Personal Library (the Admin can change it in the bot), shared the Shared
# Library.
default = ""
shared = ""

[ingest]
workers = 2
retry_delays = ["10s", "1m", "5m"]
poll_interval = "1s"
# Leftovers of a crashed Ingest older than this are removed.
scratch_ttl = "1h"
# A download silent this long is retried.
stall_timeout = "60s"

[zvuk]
url = "https://zvuk.com"
# Downloads at once, for all users.
workers = 4
# Of them per user; more risks a block.
per_user = 1
# Random pause after each download of an account.
pause = ["5s", "10s"]
sync_interval = "6h"
# Retry of stars and playlists until Navidrome scans new files.
mirror_retry_interval = "1m"
