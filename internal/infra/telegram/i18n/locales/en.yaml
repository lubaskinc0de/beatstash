  share: 📤 Share
  admin: 🛠 Admin
  feed: 🎵 Feed
  top: 🏆 Top
  import: 📥 Import from a streaming service
  accounts: 👤 Accounts
  listen: 📱 How to listen
  invite: 🎟 Invite
  how_to: ❓ How to upload
  back: ← Back
  cancel: ✖️ Cancel
  languages: 🌐 Language

try_later: ️️ Something went wrong, try again later

home:
  greeting: 👋 Hi!
  greeting_named: 👋 Hi, {{.Name}}!
  usage: 📦 {{.Used}} of {{.Quota}}
  text: |-
    {{.Service}} moves your music library from cloud services to your own storage on <a href="https://www.navidrome.org">Navidrome</a> and lets you add to it right from Telegram: just send an audio file.

    🔎 To find a track, download it in Telegram with @yv2t_bot or @murglar_bot and forward it here: I'll save it to your library.

    You can also share music with friends — here and in any chat with inline mode:
  np: now playing
  recent: recently played
  shared: fresh shares
  top: top sharers

stranger:
  text: |-
    🎧 {{.Service}} is a private music service on <a href="https://www.navidrome.org">Navidrome</a>. Everyone here has a personal library: upload tracks from Telegram and streaming services, listen in any Navidrome client, and share finds with others. Access is invite-only.

    👥 Users: {{.Users}} · 🎵 Shared tracks: {{.SharedTracks}}
  contact: "✉️ Ask for access: {{.Contact}}"

footer:
  source: Source code
  author: made by

languages: 🌐 Choose the language

how_to: |-
  ❓ <b>How to upload</b>

  Send an audio file or forward it from any chat: mp3, flac, m4a, ogg, opus, wav.
  👀 — got it, 👍 — the track is in your library, 👎 — I'll explain what went wrong.

  The library is yours: other users don't see it, but the files are on the server, and its owner can see them.

  🔗 To Share a track or its album with everyone, reply <code>/share</code> to the audio message.

listen: |-
  📱 <b>How to listen</b>

  <b>1. Account.</b> Your Navidrome login and password are the ones the bot gave you when you joined. If you had an account already, link it on the «👤 Accounts» screen.

  <b>2. In a browser.</b> {{if .NavidromeURL}}Open <a href="{{.NavidromeURL}}">{{.NavidromeURL}}</a>{{else}}Open the Navidrome address the admin gave you{{end}} and sign in with that login and password.

  <b>3. On the phone.</b> Install a Subsonic player:
  • Android: Symfonium, Tempo, Ultrasonic
  • iPhone: Amperfy, play:Sub, substreamer

  <b>4. Connect.</b> In the player add a Subsonic or Navidrome server: address {{if .NavidromeURL}}<code>{{.NavidromeURL}}</code>{{else}}of your Navidrome{{end}}, your login and password. Your library, the Shared one, stars and playlists show up there.

