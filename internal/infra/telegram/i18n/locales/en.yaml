home:
  greeting: 👋 Hi!
  greeting_named: 👋 Hi, {{.Name}}!
  # {{.Bot}} is the bot's username.
  text: |-
    {{.Service}} is your music library on <a href="https://www.navidrome.org">Navidrome</a>. You can fill it right from here.

    1. Send an audio file or forward it from any chat — it lands in your library.
    2. Listen in a browser{{if .NavidromeURL}} at <a href="{{.NavidromeURL}}">{{.NavidromeURL}}</a>{{end}} or in a Subsonic player on your phone (Symfonium, Amperfy): sign in with your Navidrome login and password.
    3. Share tracks in «🎵 Music» or in any chat with <code>@{{.Bot}}</code>.
  usage: "📦 Space for music: {{.Used}} of {{.Quota}} used"
  more: How to set up a player and everything else is in «❓ Help».

stranger:
  text: |-
    🎧 {{.Service}} is a private music service on <a href="https://www.navidrome.org">Navidrome</a>: a library for everyone, tracks straight from Telegram.

    Members: {{.Users}} · shared tracks: {{.SharedTracks}}

    Invite only.
  contact: "Ask for an invite: {{.Contact}}"

footer:
  source: Source code
  author: made by

languages: 🌐 Choose the language

settings:
  title: ⚙️ <b>Settings</b>

help:
  text: "❓ <b>Help</b>\n\nWhat would you like to know?"
  inline_button: 💬 In other chats
  space_button: 📦 Space and the Shared Library
  inline: "💬 <b>In other chats</b>\n\nType the bot's name and a command in any chat. The bot shows a list and sends what you pick to that chat:\n"
  np: what you're playing now
  recent: what you played lately
  shared: fresh in the Shared Library
  top: who shares the most
  # {{.Usage}} is an example search.
  search: Any other text searches your music, e.g. {{.Usage}}
  space: |-
    📦 <b>Space and the Shared Library</b>

    Everyone here has a library and space on the server of their own. If your space is limited, the home screen shows how much is used. Once it runs out, new tracks won't upload.

    Only you and the server's owner see your library. You can share a track or an album: it goes to the Shared Library, and others can take it for themselves. A taken track uses the space of whoever took it.

how_to: |-
  📥 <b>How to upload</b>

  Send an audio file or forward it from any chat: mp3, flac, m4a, ogg, opus and wav work.

  A reaction tells what happened to it: 👀 — working on it, 👍 — the track is in your library, 👎 — something went wrong, I'll explain.

  Where to get files: find a track in @yv2t_bot or @murglar_bot and forward it here.

  To share a track, find it in «🎵 Music» on the «Mine» tab.

listen: |-
  📱 <b>How to listen</b>

  <b>In a browser.</b> {{if .NavidromeURL}}Open <a href="{{.NavidromeURL}}">{{.NavidromeURL}}</a>{{else}}Open the Navidrome address the admin gave you{{end}} and sign in with your login and password. The bot sent them when you joined. If you had an account already, link it: «⚙️ Settings» → «🎧 Navidrome account».

  <b>On the phone.</b> Install a Subsonic player:
  • Android: Symfonium, Tempo, Ultrasonic
  • iPhone: Amperfy, play:Sub, substreamer

  In the player add a Subsonic or Navidrome server: address {{if .NavidromeURL}}<code>{{.NavidromeURL}}</code>{{else}}of your Navidrome{{end}}, your login and password. Your library, the Shared one, stars and playlists show up there.

