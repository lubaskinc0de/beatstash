    👋 Welcome!

    Choose a Navidrome login — you'll sign in to players with it. Send it as a message.

    3 to 32 characters: latin letters, digits, dot, hyphen, underscore.
  invalid: "❌ That login won't do. It needs 3 to 32 characters: latin letters, digits, dot, hyphen, underscore. Send another one."
  taken: ❌ The login <b>{{.Login}}</b> is taken. Send another one.
  failed: Could not create the account. Send the login again a bit later.
  have_account: 🔗 I already have an account
  done: |-
    ✅ Your Navidrome account is ready{{if .NavidromeURL}}: {{.NavidromeURL}}{{end}}

    Login: <code>{{.Login}}</code>
    Password: <tg-spoiler>{{.Password}}</tg-spoiler>

    Save the password and delete this message: the bot won't show it again. How to set up a player is in «❓ Help».

