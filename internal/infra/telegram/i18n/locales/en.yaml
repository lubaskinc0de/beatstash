# Texts of the Telegram bot in English. English is the reference: every
# other language has the same keys, and a key missing there falls back to
# English.
#
# Texts are Go templates (https://pkg.go.dev/text/template) that end up as
# Telegram HTML, so only <b>, <i>, <code>, <a> and <tg-spoiler> tags work.
# Every template can use:
#   {{.Service}}      the service name from the config
#   {{.NavidromeURL}} the address users open Navidrome at, empty if unset
# The link to the source code and the author's name are added by the bot
# itself: only their captions are here.
# Keys with one / few / many / other forms are plurals: the bot picks the
# form by the CLDR rules of the language and passes the number as {{.Count}}.

language:
  # Shown on the language buttons.
  name: English

bot:
  about: >-
    {{.Service}} moves your music library from cloud services to your own storage on Navidrome
    and lets you add to it right from Telegram. It also makes sharing music with friends easy,
    in any chat with inline mode. Access is invite-only.
  short_description: Your personal music library in Navidrome, filled from Telegram and streaming services
  start_command: Open the bot

