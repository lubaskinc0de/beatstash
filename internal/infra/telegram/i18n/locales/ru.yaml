register:
  choose: |-
    👋 Добро пожаловать!

    Придумайте логин для Navidrome — с ним вы будете входить в плеер. Пришлите его сообщением.

    От 3 до 32 символов: латинские буквы, цифры, точка, дефис, подчёркивание.
  invalid: "❌ Такой логин не подойдёт. Нужно от 3 до 32 символов: латинские буквы, цифры, точка, дефис, подчёркивание. Пришлите другой."
  taken: ❌ Логин <b>{{.Login}}</b> уже занят. Пришлите другой.
  failed: Не удалось создать аккаунт. Пришлите логин ещё раз чуть позже.
  have_account: 🔗 У меня уже есть аккаунт
  done: |-
    ✅ Аккаунт Navidrome готов{{if .NavidromeURL}}: {{.NavidromeURL}}{{end}}

    Логин: <code>{{.Login}}</code>
    Пароль: <tg-spoiler>{{.Password}}</tg-spoiler>

    Сохраните пароль и удалите это сообщение: второй раз бот его не покажет. Как подключить плеер — в «❓ Помощи».

