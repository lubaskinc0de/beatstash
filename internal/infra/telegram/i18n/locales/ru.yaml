# Тексты бота на русском. Ключи те же, что в en.yaml; как устроены
# шаблоны и какие переменные в них доступны, описано там.

language:
  name: Русский

bot:
  about: >-
    {{.Service}} переносит вашу музыкальную библиотеку из облачных сервисов в ваше собственное хранилище
    на Navidrome и позволяет пополнять её прямо из Telegram. А ещё с ним удобно делиться музыкой с друзьями —
    в любом чате через inline-режим. Доступ по приглашению.
  short_description: "Личная музыкальная библиотека в Navidrome: загрузка из Telegram и музыкальных сервисов"
  start_command: Открыть бота

button:
  feed: 🎵 Лента
  top: 🏆 Топ
  import: 📥 Импорт из музыкального сервиса
  accounts: 👤 Аккаунты
  listen: 📱 Как слушать
  invite: 🎟 Пригласить
  how_to: ❓ Как загружать
  back: ← Назад
  cancel: ✖️ Отмена
  languages: 🌐 Язык

try_later: ⚠️ Не получилось, попробуйте позже

home:
  greeting: 👋 Привет!
  greeting_named: 👋 Привет, {{.Name}}!
  text: |-
    {{.Service}} переносит вашу музыкальную библиотеку из облачных сервисов в ваше собственное хранилище на <a href="https://www.navidrome.org">Navidrome</a> и позволяет удобно пополнять её прямо из Telegram: просто пришлите аудиофайл.

    🔎 Чтобы найти трек, скачайте его в Telegram через @yv2t_bot или @murglar_bot и перешлите сюда: я сохраню его в вашу библиотеку.

    А ещё музыкой можно делиться с друзьями — здесь и в любом чате через inline-режим:
  np: что играет сейчас
  recent: последние треки
  shared: свежее в общей библиотеке
  top: кто больше всех делится

stranger:
  text: |-
    🎧 {{.Service}} — закрытый музыкальный сервис на <a href="https://www.navidrome.org">Navidrome</a>. У каждого здесь своя музыкальная библиотека: загружайте треки из Telegram и музыкальных сервисов, слушайте в любом клиенте Navidrome и делитесь находками с остальными. Попасть сюда можно только по приглашению.

    👥 Пользователей: {{.Users}} · 🎵 Треков в общей библиотеке: {{.SharedTracks}}
  contact: "✉️ Попросить доступ: {{.Contact}}"

footer:
  source: Исходный код
  author: автор

languages: 🌐 Выберите язык

how_to: |-
  ❓ <b>Как загружать</b>

  Пришлите аудиофайл или перешлите его из любого чата: mp3, flac, m4a, ogg, opus, wav.
  👀 — принял, 👍 — трек в библиотеке, 👎 — объясню, что не так.

  Библиотека ваша: другие пользователи её не видят, но файлы лежат на сервере, и их видит владелец сервера.

  🔗 Чтобы поделиться треком или альбомом со всеми, ответьте <code>/share</code> на аудиосообщение с ним.

listen: |-
  📱 <b>Как слушать</b>

  <b>1. Аккаунт.</b> Логин и пароль от Navidrome бот выдал вам при регистрации. Если аккаунт у вас уже был, привяжите его на экране «👤 Аккаунты».

  <b>2. В браузере.</b> {{if .NavidromeURL}}Откройте <a href="{{.NavidromeURL}}">{{.NavidromeURL}}</a>{{else}}Откройте адрес Navidrome, который дал администратор,{{end}} и войдите с этим логином и паролем.

  <b>3. На телефоне.</b> Установите плеер с поддержкой Subsonic:
  • Android: Symfonium, Tempo, Ultrasonic
  • iPhone: Amperfy, play:Sub, substreamer

  <b>4. Подключение.</b> В плеере добавьте сервер Subsonic или Navidrome: адрес {{if .NavidromeURL}}<code>{{.NavidromeURL}}</code>{{else}}вашего Navidrome{{end}}, ваш логин и пароль. Там появятся ваша библиотека, общая библиотека, звёзды и плейлисты.

