# Тексты бота на русском. Ключи те же, что в en.yaml; как устроены
# шаблоны и какие переменные в них доступны, описано там.

language:
  name: Русский

bot:
  about: >-
    {{.Service}} — ваша музыкальная библиотека на Navidrome. Присылайте треки прямо в Telegram,
    переносите коллекцию из музыкальных сервисов и делитесь музыкой в любом чате. Вход по приглашению.
  short_description: "Музыкальная библиотека на Navidrome: пополняйте её из Telegram и музыкальных сервисов"
  start_command: Открыть бота

button:
  music: 🎵 Музыка
  import: 📥 Импорт из сервиса
  help: ❓ Помощь
  settings: ⚙️ Настройки
  admin: 🛠 Админка
  top: 🏆 Кто делится больше всех
  accounts: 🎧 Аккаунт Navidrome
  how_to: 📥 Загрузка
  listen: 📱 Как слушать
  invite: 🎟 Пригласить
  back: ← Назад
  cancel: Отмена
  languages: 🌐 Язык

try_later: Не получилось, попробуйте позже

home:
  greeting: 👋 Привет!
  greeting_named: 👋 Привет, {{.Name}}!
  text: |-
    {{.Service}} — ваша музыкальная библиотека на <a href="https://www.navidrome.org">Navidrome</a>. Пополнять её можно прямо отсюда.

    1. Пришлите аудиофайл или перешлите его из любого чата — он появится в библиотеке.
    2. Слушайте в браузере{{if .NavidromeURL}} на <a href="{{.NavidromeURL}}">{{.NavidromeURL}}</a>{{end}} или в Subsonic-плеере на телефоне (Symfonium, Amperfy): войдите с логином и паролем Navidrome.
    3. Делитесь треками в «🎵 Музыке» или в любом чате через <code>@{{.Bot}}</code>.
  usage: "📦 Место под музыку: занято {{.Used}} из {{.Quota}}"
  more: Как подключить плеер и всё остальное — в «❓ Помощи».

stranger:
  text: |-
    🎧 {{.Service}} — закрытый музыкальный сервис на <a href="https://www.navidrome.org">Navidrome</a>: у каждого своя библиотека, треки — прямо из Telegram.

    Участников: {{.Users}} · треков в общей библиотеке: {{.SharedTracks}}

    Вход только по приглашению.
  contact: "Попросить приглашение: {{.Contact}}"

footer:
  source: Исходный код
  author: автор

languages: 🌐 Выберите язык

settings:
  title: ⚙️ <b>Настройки</b>

help:
  text: "❓ <b>Помощь</b>\n\nО чём рассказать?"
  inline_button: 💬 В других чатах
  space_button: 📦 Место и общая библиотека
  inline: "💬 <b>В других чатах</b>\n\nНаберите в любом чате имя бота и команду. Бот покажет список, а то, что вы выберете, отправит в этот чат:\n"
  np: что играет у вас сейчас
  recent: что вы недавно слушали
  shared: свежее в общей библиотеке
  top: кто делится больше всех
  search: Любой другой текст ищет по вашей музыке, например {{.Usage}}
  space: |-
    📦 <b>Место и общая библиотека</b>

    У каждого здесь своя библиотека и своё место на сервере. Если место ограничено, на главном экране видно, сколько уже занято. Когда оно закончится, новые треки не загрузятся.

    Вашу библиотеку видите только вы и владелец сервера. Треком или альбомом можно поделиться: он попадёт в общую библиотеку, и другие смогут взять его себе. Взятый трек занимает место у того, кто его взял.

how_to: |-
  📥 <b>Как загружать</b>

  Пришлите аудиофайл или перешлите его из любого чата. Подходят mp3, flac, m4a, ogg, opus и wav.

  Реакция на сообщение покажет, что с ним: 👀 — взял в работу, 👍 — трек в библиотеке, 👎 — не получилось, объясню почему.

  Где взять файл: найдите трек в @yv2t_bot или @murglar_bot и перешлите его сюда.

  Чтобы поделиться треком, найдите его в «🎵 Музыке» на вкладке «Моя».

listen: |-
  📱 <b>Как слушать</b>

  <b>В браузере.</b> {{if .NavidromeURL}}Откройте <a href="{{.NavidromeURL}}">{{.NavidromeURL}}</a>{{else}}Откройте адрес Navidrome, который дал администратор,{{end}} и войдите со своим логином и паролем. Их бот прислал при регистрации. Если аккаунт у вас уже был, привяжите его: «⚙️ Настройки» → «🎧 Аккаунт Navidrome».

  <b>На телефоне.</b> Поставьте плеер с поддержкой Subsonic:
  • Android: Symfonium, Tempo, Ultrasonic
  • iPhone: Amperfy, play:Sub, substreamer

  В плеере добавьте сервер Subsonic или Navidrome: адрес {{if .NavidromeURL}}<code>{{.NavidromeURL}}</code>{{else}}вашего Navidrome{{end}}, ваш логин и пароль. Там будут ваша библиотека, общая библиотека, звёзды и плейлисты.

