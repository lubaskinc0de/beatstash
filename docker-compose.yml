services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    healthcheck:
        test: ["CMD-SHELL", "pg_isready -U postgres"]
        interval: 2s
    volumes:
      - postgres_data:/var/lib/postgresql/data

  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TELEGRAM_LOCAL: "1"
    volumes:
      - telegram_bot_api_data:/var/lib/telegram-bot-api

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: navidrome-tg-bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      telegram-bot-api:
        condition: service_started
    env_file:
      - .env
    environment:
      DB_DSN: "host=postgres user=postgres password=postgres dbname=postgres port=5432 sslmode=disable"
      CONFIG_FILE: "/app/config.toml"
    volumes:
      - ./config.docker.toml:/app/config.toml:ro
      - ./test_data:/music
      - telegram_bot_api_data:/var/lib/telegram-bot-api

  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    restart: unless-stopped
    ports:
      - "4533:4533"
    environment:
      # The bot keeps the Shared Library in /music/shared and Personal ones in /music/users.
      ND_MUSICFOLDER: "/music/shared"
      ND_DATAFOLDER: "/data"
      ND_LOGLEVEL: "info"
      # Listen Links are Navidrome shares.
      ND_ENABLESHARING: "true"
    volumes:
      - ./test_data:/music:ro
      - navidrome_data:/data

volumes:
  telegram_bot_api_data:
  postgres_data:
  navidrome_data:
